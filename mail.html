<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صندوق الوارد | تم التأكيد من Gmail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .msg-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .msg-item:hover { background: rgba(59, 130, 246, 0.1); border-color: #3b82f6; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-2xl mx-auto text-center">
        <div class="glass p-8 rounded-3xl shadow-2xl border-t-4 border-blue-500">
            <h1 class="text-blue-400 text-lg mb-2">بريدك المؤقت جاهز</h1>
            <div id="emailDisplay" class="text-2xl font-mono bg-black/40 p-4 rounded-xl mb-4 border border-blue-900/50 select-all">
                جاري التحميل...
            </div>
            <p id="status" class="text-sm text-gray-400 animate-pulse">يتم فحص البريد الآن...</p>
        </div>

        <div class="mt-8 text-right">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                <span class="w-3 h-3 bg-green-500 rounded-full"></span> صندوق الوارد
            </h2>
            <div id="inbox" class="space-y-3 min-h-[200px]">
                <div class="text-center text-gray-600 py-10 italic">في انتظار وصول الرسالة من Gmail...</div>
            </div>
        </div>
    </div>

    <script>
        // تثبيت الهوية لضمان عدم ضياع الرسالة عند التحديث
        const user = localStorage.getItem('tmp_v4') || Math.random().toString(36).substring(2, 10);
        const domain = "1secmail.com";
        localStorage.setItem('tmp_v4', user);

        const email = `${user}@${domain}`;
        document.getElementById('emailDisplay').innerText = email;

        async function checkInbox() {
            // استخدام وسيط AllOrigins لفك حماية المتصفح
            const targetUrl = `https://www.1secmail.com/api/v1/?action=getMessages&login=${user}&domain=${domain}`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

            try {
                const res = await fetch(proxyUrl);
                const json = await res.json();
                const messages = JSON.parse(json.contents); // استخراج البيانات الحقيقية من الوسيط

                const inboxDiv = document.getElementById('inbox');
                const status = document.getElementById('status');

                if (messages.length > 0) {
                    status.innerText = `تم وصول ${messages.length} رسالة!`;
                    status.classList.remove('text-gray-400');
                    status.classList.add('text-green-400');
                    
                    inboxDiv.innerHTML = "";
                    messages.forEach(msg => {
                        const div = document.createElement('div');
                        div.className = "msg-item p-4 rounded-2xl cursor-pointer";
                        div.innerHTML = `
                            <div class="font-bold text-blue-400">${msg.from}</div>
                            <div class="text-sm text-gray-200">${msg.subject}</div>
                            <div class="text-[10px] text-gray-500 mt-1">${msg.date}</div>
                        `;
                        div.onclick = () => readMessage(msg.id);
                        inboxDiv.appendChild(div);
                    });
                }
            } catch (err) {
                console.error("Error:", err);
            }
        }

        async function readMessage(id) {
            const targetUrl = `https://www.1secmail.com/api/v1/?action=readMessage&login=${user}&domain=${domain}&id=${id}`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
            
            try {
                const res = await fetch(proxyUrl);
                const json = await res.json();
                const data = JSON.parse(json.contents);
                alert(`من: ${data.from}\nالموضوع: ${data.subject}\n\nالنص:\n${data.textBody}`);
            } catch (e) {
                alert("خطأ في قراءة الرسالة");
            }
        }

        // فحص كل 5 ثواني
        setInterval(checkInbox, 5000);
        checkInbox();
    </script>
</body>
</html>
