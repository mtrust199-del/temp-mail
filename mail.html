<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بريد مؤقت | صندوق الوارد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .msg-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
            cursor: pointer;
        }
        .msg-item:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: #3b82f6;
        }
        .msg-item.unread {
            border-right: 3px solid #3b82f6;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            flex-shrink: 0;
        }
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .action-btn {
            transition: transform 0.15s, background 0.2s;
        }
        .action-btn:active { transform: scale(0.95); }
        pre { white-space: pre-wrap; word-break: break-word; }

        /* تأثير نبضة للرسائل الجديدة */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .msg-item { animation: fadeIn 0.3s ease forwards; }

        /* شريط تنبيه نسخ */
        #copyToast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #22c55e;
            color: white;
            padding: 0.6rem 1.4rem;
            border-radius: 999px;
            font-weight: bold;
            font-size: 0.875rem;
            transition: transform 0.3s ease;
            z-index: 100;
            pointer-events: none;
        }
        #copyToast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body class="p-6 min-h-screen">

    <!-- شريط تنبيه النسخ -->
    <div id="copyToast">✅ تم نسخ البريد!</div>

    <div class="max-w-2xl mx-auto">

        <!-- ترويسة البريد -->
        <div class="glass p-8 rounded-3xl shadow-2xl border-t-4 border-blue-500 text-center mb-8">
            <div class="flex items-center justify-center gap-2 mb-3">
                <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
                <h1 class="text-blue-400 text-lg font-semibold">بريدك المؤقت جاهز</h1>
            </div>

            <!-- عرض الإيميل مع زر نسخ — ترتيب RTL صحيح: نص أولاً ثم الأزرار -->
            <div class="flex items-center gap-2 justify-center mb-4 flex-row-reverse">
                <!-- الأزرار على اليسار في RTL -->
                <div class="flex gap-2 flex-shrink-0">
                    <button id="btnCopy" onclick="copyEmail()" title="نسخ البريد"
                        class="action-btn bg-blue-600 hover:bg-blue-500 text-white px-4 py-3 rounded-xl text-sm font-bold whitespace-nowrap">
                        📋 نسخ
                    </button>
                    <button id="btnNew" onclick="refreshEmail()" title="الحصول على إيميل جديد"
                        class="action-btn bg-slate-700 hover:bg-slate-600 text-white px-4 py-3 rounded-xl text-sm font-bold whitespace-nowrap">
                        🔄 جديد
                    </button>
                </div>
                <!-- عرض الإيميل على اليمين -->
                <div id="emailDisplay"
                    class="text-base font-mono bg-black/40 px-5 py-3 rounded-xl border border-blue-900/50 select-all flex-1 text-center truncate">
                    جاري التحميل...
                </div>
            </div>

            <!-- شريط الحالة -->
            <div id="status" class="text-sm text-gray-400 flex items-center justify-center gap-2">
                <span class="spinner"></span>
                <span>يتم تحميل البريد...</span>
            </div>
        </div>

        <!-- صندوق الوارد -->
        <div>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <span id="inboxDot" class="w-3 h-3 bg-green-500 rounded-full inline-block"></span>
                    صندوق الوارد
                </h2>
                <div class="flex items-center gap-3">
                    <span id="msgCount" class="text-sm text-gray-500"></span>
                    <button onclick="checkInbox()" title="تحديث يدوي"
                        class="action-btn text-gray-400 hover:text-white text-lg" id="refreshBtn">
                        ⟳
                    </button>
                </div>
            </div>

            <div id="inbox" class="space-y-3 min-h-[200px]">
                <div class="text-center text-gray-600 py-10 italic" id="emptyMsg">
                    في انتظار وصول الرسائل...
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة قراءة الرسالة -->
    <div class="modal-overlay" id="msgModal" onclick="closeModal(event)">
        <div class="modal-box">
            <div class="flex justify-between items-start mb-4">
                <h3 id="modalSubject" class="text-lg font-bold text-blue-300 flex-1 pl-4"></h3>
                <button onclick="document.getElementById('msgModal').classList.remove('active')"
                    class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            <div class="text-sm text-gray-400 mb-1">من: <span id="modalFrom" class="text-gray-200"></span></div>
            <div class="text-sm text-gray-400 mb-4">التاريخ: <span id="modalDate" class="text-gray-200"></span></div>
            <hr class="border-white/10 mb-4">
            <div id="modalBody" class="text-sm text-gray-200 leading-relaxed"></div>
        </div>
    </div>

    <script>
    // ============================
    //   متغيرات عامة
    // ============================
    let sidToken   = localStorage.getItem('gm_sid')   || '';
    let currentEmail = localStorage.getItem('gm_email') || '';
    let currentAlias = localStorage.getItem('gm_alias') || '';
    let checkInterval = null;
    let seenIds = new Set(JSON.parse(localStorage.getItem('gm_seen') || '[]'));

    // ============================
    //  مصادر API مع Proxy بديل
    // ============================
    const DIRECT = 'https://api.guerrillamail.com/ajax.php';
    // نستخدم cors-anywhere كبروكسي احتياطي عند الحاجة
    const PROXY   = 'https://corsproxy.io/?' + encodeURIComponent(DIRECT);

    let useProxy = false; // يتحول تلقائياً إند فشل الطلب المباشر

    async function apiCall(params) {
        const qs = new URLSearchParams(params).toString();
        const directUrl = `${DIRECT}?${qs}`;
        const proxyUrl  = `${PROXY.replace(encodeURIComponent(DIRECT), encodeURIComponent(DIRECT + '?' + qs))}`;

        // محاولة مباشرة أولاً
        if (!useProxy) {
            try {
                const res = await fetch(directUrl, { signal: AbortSignal.timeout(8000) });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const json = await res.json();
                return json._oma_data || json;
            } catch (err) {
                console.warn('Direct API failed, switching to proxy:', err.message);
                useProxy = true;
            }
        }

        // محاولة عبر بروكسي
        const finalUrl = `https://corsproxy.io/?${encodeURIComponent(directUrl)}`;
        const res = await fetch(finalUrl, { signal: AbortSignal.timeout(10000) });
        if (!res.ok) throw new Error('Proxy HTTP ' + res.status);
        const json = await res.json();
        return json._oma_data || json;
    }

    // ============================
    //   تهيئة أو استئناف الجلسة
    // ============================
    async function init() {
        setStatus('loading', 'جاري تحميل بريدك...');
        disableButtons(true);

        if (sidToken && currentEmail) {
            document.getElementById('emailDisplay').innerText = currentEmail;
            setStatus('active', 'بريدك جاهز • يتحقق كل 5 ثوانٍ');
            await checkInbox();
        } else {
            await createNewEmail();
        }

        disableButtons(false);
        clearInterval(checkInterval);
        checkInterval = setInterval(checkInbox, 5000);
    }

    async function createNewEmail() {
        try {
            const data = await apiCall({ f: 'get_email_address' });

            sidToken     = data.sid_token  || '';
            currentEmail = data.email_addr || '';
            currentAlias = data.alias      || '';

            if (!sidToken || !currentEmail) throw new Error('استجابة API فارغة');

            localStorage.setItem('gm_sid',   sidToken);
            localStorage.setItem('gm_email', currentEmail);
            localStorage.setItem('gm_alias', currentAlias);

            document.getElementById('emailDisplay').innerText = currentEmail;
            setStatus('active', 'بريدك جاهز • يتحقق كل 5 ثوانٍ');
            await checkInbox();
        } catch (err) {
            setStatus('error', '⚠️ تعذّر الاتصال بالخادم — تحقق من اتصالك بالإنترنت');
            console.error('createNewEmail error:', err);
        }
    }

    // ============================
    //   تجديد الإيميل
    // ============================
    async function refreshEmail() {
        if (!confirm('هل تريد الحصول على إيميل جديد؟ ستُفقد الرسائل الحالية.')) return;
        clearInterval(checkInterval);
        sidToken = currentEmail = currentAlias = '';
        seenIds.clear();
        ['gm_sid','gm_email','gm_alias','gm_seen'].forEach(k => localStorage.removeItem(k));
        document.getElementById('inbox').innerHTML =
            '<div class="text-center text-gray-600 py-10 italic">في انتظار وصول الرسائل...</div>';
        document.getElementById('msgCount').innerText = '';
        await init();
    }

    // ============================
    //   فحص صندوق الوارد
    // ============================
    async function checkInbox() {
        if (!sidToken) return;
        try {
            const data = await apiCall({ f: 'get_email_list', offset: 0, sid_token: sidToken });
            const messages = data.list || [];
            renderInbox(messages);
        } catch (err) {
            console.error('checkInbox error:', err);
            // لا تُظهر خطأ للمستخدم عند كل دورة فحص — سيُعاد المحاولة تلقائياً
        }
    }

    // ============================
    //   رسم الرسائل
    // ============================
    function renderInbox(messages) {
        const inboxDiv = document.getElementById('inbox');
        const countEl  = document.getElementById('msgCount');

        if (!messages || messages.length === 0) {
            inboxDiv.innerHTML =
                '<div class="text-center text-gray-600 py-10 italic">في انتظار وصول الرسائل...</div>';
            countEl.innerText = '';
            return;
        }

        // إخفاء رسالة الترحيب التلقائية من guerrillamail
        const filtered = messages.filter(m => String(m.mail_id) !== '1');

        if (filtered.length === 0) {
            inboxDiv.innerHTML =
                '<div class="text-center text-gray-600 py-10 italic">في انتظار وصول الرسائل...</div>';
            countEl.innerText = '';
            return;
        }

        countEl.innerText = `${filtered.length} رسالة`;
        inboxDiv.innerHTML = '';

        filtered.forEach(msg => {
            const isUnread = !seenIds.has(String(msg.mail_id)) && msg.mail_read == 0;
            const div = document.createElement('div');
            div.className = `msg-item p-4 rounded-2xl ${isUnread ? 'unread' : ''}`;

            const excerpt = (msg.mail_excerpt || '').substring(0, 100);
            div.innerHTML = `
                <div class="flex justify-between items-start gap-2">
                    <div class="font-bold text-blue-400 truncate">${escapeHtml(msg.mail_from)}</div>
                    <div class="text-[11px] text-gray-500 whitespace-nowrap">${escapeHtml(msg.mail_date || '')}</div>
                </div>
                <div class="text-sm text-gray-200 mt-1 font-medium">${escapeHtml(msg.mail_subject || '(بدون موضوع)')}</div>
                <div class="text-xs text-gray-500 mt-1 truncate">${escapeHtml(excerpt)}${excerpt.length >= 100 ? '...' : ''}</div>
                ${isUnread ? '<span class="inline-block mt-2 text-[10px] bg-blue-600/30 text-blue-300 px-2 py-0.5 rounded-full">جديد</span>' : ''}
            `;
            div.onclick = () => readMessage(msg.mail_id, div);
            inboxDiv.appendChild(div);
        });
    }

    // ============================
    //   قراءة رسالة
    // ============================
    async function readMessage(mailId, el) {
        try {
            const data = await apiCall({ f: 'fetch_email', email_id: mailId, sid_token: sidToken });

            document.getElementById('modalSubject').innerText = data.mail_subject || '(بدون موضوع)';
            document.getElementById('modalFrom').innerText    = data.mail_from   || '';
            document.getElementById('modalDate').innerText    = data.mail_date   || '';

            const body    = data.mail_body || data.mail_excerpt || '';
            const bodyDiv = document.getElementById('modalBody');

            if (data.content_type === 'html' || body.trim().startsWith('<')) {
                const blob = new Blob([body], { type: 'text/html' });
                const url  = URL.createObjectURL(blob);
                bodyDiv.innerHTML =
                    `<iframe src="${url}" class="w-full rounded-xl border border-white/10"
                        style="height:350px; background:white;" sandbox="allow-same-origin"></iframe>`;
            } else {
                bodyDiv.innerHTML =
                    `<pre class="text-sm text-gray-200 leading-relaxed">${escapeHtml(body)}</pre>`;
            }

            document.getElementById('msgModal').classList.add('active');

            // تحديد كمقروء
            seenIds.add(String(mailId));
            localStorage.setItem('gm_seen', JSON.stringify([...seenIds]));
            if (el) {
                el.classList.remove('unread');
                const badge = el.querySelector('span.bg-blue-600\\/30');
                if (badge) badge.remove();
            }
        } catch (e) {
            alert('خطأ في قراءة الرسالة: ' + e.message);
        }
    }

    // ============================
    //   إغلاق المودال
    // ============================
    function closeModal(e) {
        if (e.target.id === 'msgModal') {
            document.getElementById('msgModal').classList.remove('active');
        }
    }
    // ESC لإغلاق المودال
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') document.getElementById('msgModal').classList.remove('active');
    });

    // ============================
    //   نسخ الإيميل — مُصلَح
    // ============================
    function copyEmail() {
        const email = document.getElementById('emailDisplay').innerText.trim();
        if (!email || email === 'جاري التحميل...') return;

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(email).then(showCopyToast).catch(fallbackCopy);
        } else {
            fallbackCopy();
        }

        function fallbackCopy() {
            // طريقة بديلة للمتصفحات القديمة
            const ta = document.createElement('textarea');
            ta.value = email;
            ta.style.cssText = 'position:fixed;top:-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            showCopyToast();
        }
    }

    function showCopyToast() {
        const t = document.getElementById('copyToast');
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    // ============================
    //   تعطيل/تفعيل الأزرار
    // ============================
    function disableButtons(disabled) {
        document.getElementById('btnCopy').disabled = disabled;
        document.getElementById('btnNew').disabled  = disabled;
        document.getElementById('btnCopy').style.opacity = disabled ? '0.5' : '1';
        document.getElementById('btnNew').style.opacity  = disabled ? '0.5' : '1';
    }

    // ============================
    //   شريط الحالة
    // ============================
    function setStatus(type, msg) {
        const el = document.getElementById('status');
        if (type === 'loading') {
            el.innerHTML = `<span class="spinner"></span><span class="text-gray-400">${msg}</span>`;
        } else if (type === 'active') {
            el.innerHTML = `<span class="w-2 h-2 bg-green-400 rounded-full inline-block flex-shrink-0"></span><span class="text-green-400">${msg}</span>`;
        } else if (type === 'error') {
            el.innerHTML = `<span class="text-red-400">${msg}</span>
                <button onclick="init()" class="mr-2 text-xs underline text-blue-400 hover:text-blue-300">إعادة المحاولة</button>`;
        }
    }

    // ============================
    //   escape HTML
    // ============================
    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // بدء التطبيق
    init();
    </script>
</body>
</html>
