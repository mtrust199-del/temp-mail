<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صندوق الوارد | بريدك المؤقت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen pb-10">

    <div class="container mx-auto px-4 py-10 max-w-4xl text-center">
        <div class="glass rounded-3xl p-8 mb-8">
            <h1 class="text-xl mb-4 text-blue-400">بريدك المؤقت النشط</h1>
            <div class="flex flex-col md:flex-row items-center justify-center gap-3 bg-black/40 p-4 rounded-2xl border border-blue-500/30">
                <span id="emailAddr" class="text-2xl font-mono text-white tracking-widest">جاري التحميل...</span>
                <button onclick="copyEmail()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-xl transition">نسخ</button>
            </div>
            <p id="statusUpdate" class="text-xs text-blue-300 mt-4 animate-pulse italic">في انتظار وصول رسائل من Gmail...</p>
        </div>

        <div class="glass rounded-3xl overflow-hidden min-h-[300px]">
            <div class="bg-white/10 p-4 border-b border-white/10 text-right">صندوق الوارد</div>
            <div id="messagesList" class="p-4 space-y-3 text-right">
                <div class="text-center py-20 text-gray-500">لا توجد رسائل بعد.. جرب الإرسال الآن</div>
            </div>
        </div>
    </div>

    <script>
        // تثبيت النطاق لضمان التوافق
        const randomName = localStorage.getItem('user_v2') || Math.random().toString(36).substring(2, 10);
        const randomDomain = "1secmail.com";
        localStorage.setItem('user_v2', randomName);
        
        const fullEmail = `${randomName}@${randomDomain}`;
        document.getElementById('emailAddr').innerText = fullEmail;

        function copyEmail() {
            navigator.clipboard.writeText(fullEmail);
            alert("تم نسخ البريد: " + fullEmail);
        }

        async function fetchMessages() {
            const url = `https://www.1secmail.com/api/v1/?action=getMessages&login=${randomName}&domain=${randomDomain}`;
            
            try {
                // محاولة الجلب المباشر
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                updateUI(data);
            } catch (error) {
                console.log("التبديل إلى الوضع الاحتياطي (Proxy)...");
                // إذا فشل الجلب المباشر (CORS)، نستخدم الوسيط
                try {
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                    const proxyRes = await fetch(proxyUrl);
                    const proxyData = await proxyRes.json();
                    const realData = JSON.parse(proxyData.contents);
                    updateUI(realData);
                } catch (e) {
                    console.error("فشل كلي في جلب الرسائل:", e);
                }
            }
        }

        function updateUI(messages) {
            const list = document.getElementById('messagesList');
            const status = document.getElementById('statusUpdate');
            
            if (messages.length > 0) {
                status.innerText = `تم استلام ${messages.length} رسالة!`;
                list.innerHTML = "";
                messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = "bg-white/5 p-4 rounded-xl border border-white/10 hover:bg-blue-900/20 cursor-pointer";
                    div.innerHTML = `<strong>من: ${msg.from}</strong><br><span class="text-sm text-gray-400">${msg.subject}</span>`;
                    div.onclick = () => readMail(msg.id);
                    list.appendChild(div);
                });
            }
        }

        async function readMail(id) {
            const url = `https://www.1secmail.com/api/v1/?action=readMessage&login=${randomName}&domain=${randomDomain}&id=${id}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                alert(`المحتوى:\n\n${data.textBody}`);
            } catch (e) {
                // محاولة القراءة عبر الوسيط إذا فشل المباشر
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const res = await fetch(proxyUrl);
                const pData = await res.json();
                const d = JSON.parse(pData.contents);
                alert(`المحتوى:\n\n${d.textBody}`);
            }
        }

        setInterval(fetchMessages, 5000);
        fetchMessages();
    </script>
</body>
</html>
