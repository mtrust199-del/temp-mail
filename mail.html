<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صندوق الوارد | بريدك المؤقت جاهز</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .ad-box { background: rgba(255, 255, 255, 0.02); border: 1px dashed #334155; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.7rem; }
    </style>
</head>
<body class="min-h-screen">

    <div class="container mx-auto p-4 grid grid-cols-2 gap-4">
        <div class="ad-box h-20">إعلان 1</div>
        <div class="ad-box h-20">إعلان 2</div>
    </div>

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="glass rounded-3xl p-8 text-center mb-8">
            <h1 class="text-2xl mb-6 text-blue-400 font-bold">عنوان بريدك الإلكتروني المؤقت</h1>
            
            <div class="flex flex-col md:flex-row items-center justify-center gap-4 bg-black/50 p-4 rounded-2xl border border-blue-500/30">
                <span id="emailAddr" class="text-xl md:text-2xl font-mono text-white select-all">جاري التحميل...</span>
                <div class="flex gap-2">
                    <button onclick="copyEmail()" class="bg-blue-600 hover:bg-blue-500 p-3 rounded-xl transition">
                        <i class="fas fa-copy"></i> نسخ
                    </button>
                    <button onclick="window.location.reload()" class="bg-gray-700 hover:bg-gray-600 p-3 rounded-xl transition">
                        <i class="fas fa-sync-alt"></i> جديد
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-6">
                <div class="ad-box h-24">إعلان 3</div>
                <div class="ad-box h-24">إعلان 4</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="hidden lg:block space-y-4">
                <div class="ad-box h-64">إعلان 5</div>
                <div class="ad-box h-64">إعلان 6</div>
            </div>

            <div class="lg:col-span-3">
                <div class="glass rounded-3xl overflow-hidden min-h-[300px]">
                    <div class="bg-white/10 p-4 flex justify-between items-center">
                        <span class="font-bold">صندوق الوارد</span>
                        <span id="status" class="text-xs text-green-400">متصل - تحديث تلقائي</span>
                    </div>
                    <div id="messagesList" class="p-4 space-y-3">
                        <div class="text-center py-20 text-gray-500 italic">في انتظار وصول رسائل...</div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mt-6">
                    <div class="ad-box h-32">إعلان 7</div>
                    <div class="ad-box h-32">إعلان 8</div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mx-auto p-4 grid grid-cols-2 md:grid-cols-4 gap-4 mt-10 opacity-50">
        <div class="ad-box h-20">إعلان 9</div>
        <div class="ad-box h-20">إعلان 10</div>
        <div class="ad-unit h-20">SEO 1</div>
        <div class="ad-unit h-20">SEO 2</div>
    </div>

    <script>
        // استخدام خدمة 1secmail المجانية لإنشاء إيميل حقيقي
        const domains = ["1secmail.com", "1secmail.org", "1secmail.net"];
        const randomName = Math.random().toString(36).substring(2, 12);
        const randomDomain = domains[Math.floor(Math.random() * domains.length)];
        const email = randomName + "@" + randomDomain;

        document.getElementById('emailAddr').innerText = email;

        function copyEmail() {
            navigator.clipboard.writeText(email);
            alert("تم نسخ الإيميل: " + email);
        }

        // دالة فحص الرسائل
        async function fetchMessages() {
            try {
                const response = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${randomName}&domain=${randomDomain}`);
                const data = await response.json();
                
                const list = document.getElementById('messagesList');
                if (data.length > 0) {
                    list.innerHTML = ""; // مسح رسالة الانتظار
                    data.forEach(msg => {
                        const div = document.createElement('div');
                        div.className = "bg-white/5 p-4 rounded-xl border border-white/10 hover:bg-white/10 cursor-pointer";
                        div.innerHTML = `<strong>من: ${msg.from}</strong><br><small>${msg.subject}</small>`;
                        div.onclick = () => alert("عرض محتوى الرسالة يحتاج لفتح الـ API الخاص بالرسالة");
                        list.appendChild(div);
                    });
                }
            } catch (error) {
                console.error("خطأ في الاتصال بالـ API");
            }
        }

        // فحص كل 5 ثواني
        setInterval(fetchMessages, 5000);
        fetchMessages();
    </script>
</body>
</html>
